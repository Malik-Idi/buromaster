<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster AI | Interface Officielle</title>
    <link rel="stylesheet" href="style-chat.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
</head>
<body>
    <div class="chat-wrapper">
        <header>
            <a href="../" class="back">←</a>
            <div class="ai-status">
                <span class="dot"></span>
                <h1>BUROMASTER AI</h1>
            </div>
        </header>

        <div id="chat-box" class="chat-content">
            <div class="msg ai">Bonjour ! Je suis BuroMaster AI. 🤖 
Je peux vous aider pour vos épreuves, exposés, CV et travaux de bureautique. Que souhaitez-vous faire ?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Décrivez votre besoin..." onkeypress="handleEnter(event)">
            <button onclick="sendMessage()">Envoyer</button>
        </div>
    </div>

    <!-- Liaison du fichier JavaScript -->
    <script src="script.js"></script>
</body>
</html>

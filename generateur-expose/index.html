<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster 2026 – Assistant d'Exposé</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com">
</head>
<body>

<header class="main-header">
    <div class="header-content">
        <h1><i class="fas fa-graduation-cap"></i> BuroMaster</h1>
        <nav class="steps">
            <span class="step-link active" id="link-plan" role="button" tabindex="0"><i class="fas fa-list-ol"></i> Plan</span>
            <span class="step-link" id="link-intro" role="button" tabindex="0"><i class="fas fa-align-left"></i> Intro</span>
            <span class="step-link" id="link-dev" role="button" tabindex="0"><i class="fas fa-pen-nib"></i> Corps</span>
            <span class="step-link" id="link-conclu" role="button" tabindex="0"><i class="fas fa-flag-checkered"></i> Conclusion</span>
        </nav>
    </div>
</header>

<section class="config-section">
    <div class="config-bar">
        <div class="config-group">
            <label><i class="fas fa-users"></i> Classe</label>
            <input type="text" id="studentClass" placeholder="Ex: 3ème A">
        </div>
        <div class="config-group main-theme">
            <label><i class="fas fa-lightbulb"></i> Thème de l'exposé</label>
            <input type="text" id="theme" placeholder="Ex: La déforestation au Bénin">
        </div>
        <div class="config-actions">
            <button id="advancedOptionsBtn" class="icon-btn" title="Options avancées"><i class="fas fa-sliders"></i></button>
            <button id="resetAllBtn" class="icon-btn reset" title="Tout effacer"><i class="fas fa-trash-alt"></i></button>
        </div>
    </div>

    <div id="advancedPanel" class="advanced-panel" style="display: none;">
        <div class="option-item">
            <label>Police</label>
            <select id="fontSelect">
                <option value="'Times New Roman', serif">Times New Roman</option>
                <option value="'Arial', sans-serif">Arial</option>
                <option value="'Poppins', sans-serif">Poppins</option>
            </select>
        </div>
        <div class="option-item">
            <label>Taille (px)</label>
            <input type="number" id="fontSizeInput" value="12" min="10" max="18">
        </div>
        <div class="option-item">
            <label>Niveau IA</label>
            <select id="aiDetailLevel">
                <option value="concis">Concis</option>
                <option value="standard" selected>Standard</option>
                <option value="detaille">Détaillé</option>
            </select>
        </div>
    </div>
</section>

<main class="main-container">
    <section class="editor-side">
        <div class="card editor-card">
            <div class="card-header">
                <h2 id="step-title">Édition du Plan</h2>
                <div class="toggle-group">
                    <input type="checkbox" id="autoFormatCheckbox" checked>
                    <label for="autoFormatCheckbox">Auto-format</label>
                </div>
            </div>

            <div class="toolbar">
                <div class="history">
                    <button id="undoBtn" title="Annuler"><i class="fas fa-rotate-left"></i></button>
                    <button id="redoBtn" title="Rétablir"><i class="fas fa-rotate-right"></i></button>
                </div>
                <button type="button" id="generateBtn" class="ai-btn">
                    <i class="fas fa-wand-magic-sparkles"></i> Générer avec l'IA
                </button>
            </div>

            <textarea id="editor" class="main-editor" placeholder="Rédigez ici..."></textarea>
            <div id="dev-blocks-container" style="display: none;"></div>

            <div class="footer-actions">
                <button type="button" id="validateBtn" class="primary-btn">Valider l'étape</button>
                <button type="button" id="nextStepBtn" class="secondary-btn" style="display: none;">Étape suivante <i class="fas fa-arrow-right"></i></button>
                <button type="button" id="downloadPdf" class="download-btn">
                    <i class="fas fa-file-pdf"></i> PDF
                </button>
            </div>
        </div>
    </section>

    <section class="preview-side">
        <div class="preview-card">
            <div class="preview-toolbar">
                <h3>Aperçu A4</h3>
                <div class="zoom-controls">
                    <button id="zoomOutBtn"><i class="fas fa-magnifying-glass-minus"></i></button>
                    <span id="zoomLevel">60%</span>
                    <button id="zoomInBtn"><i class="fas fa-magnifying-glass-plus"></i></button>
                </div>
            </div>
            <div class="preview-viewport" id="preview-pages">
                <!-- Les pages s'affichent ici -->
            </div>
        </div>
    </section>
</main>

<div id="syncModal" class="modal-overlay" style="display: none;">
    <div class="modal-content">
        <div class="modal-icon"><i class="fas fa-sync-alt"></i></div>
        <h3>Synchronisation</h3>
        <p>Le plan a changé. Comment mettre à jour le contenu ?</p>
        <div class="modal-options">
            <button id="btnSyncTitles" class="opt-btn">
                <strong>Option 1 : Garder mes textes</strong>
                <span>Seuls les titres seront mis à jour.</span>
            </button>
            <button id="btnSyncAll" class="opt-btn danger">
                <strong>Option 2 : Tout réécrire</strong>
                <span>L'IA reconstruira tout selon le nouveau plan.</span>
            </button>
        </div>
        <button id="btnCancelSync" class="close-modal">Ignorer</button>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com"></script>
<script src="script.js"></script>
</body>
</html>

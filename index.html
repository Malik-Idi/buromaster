<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster 2026 – Assistant d'Exposé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>BuroMaster</h1>
    <nav class="steps">
        <span class="step-link active" id="link-plan">Plan</span>
        <span class="step-link" id="link-intro">Intro</span>
        <span class="step-link" id="link-dev">Développement</span>
        <span class="step-link" id="link-conclu">Conclusion</span>
    </nav>
</header>

<!-- NOUVEAU : Bouton Options avancées -->
<div style="padding: 10px 20px; text-align: right; background: #e9e9e9; border-bottom: 1px solid #ddd;">
    <button id="advancedOptionsBtn" style="background: #f4f4f4; border: 1px solid #ccc; padding: 8px 15px; cursor: pointer; border-radius: 5px;">Options avancées</button>
</div>

<section class="theme" style="display: flex; justify-content: center; gap: 20px;">
    <div>
        <label for="theme">Thème :</label>
        <input type="text" id="theme" placeholder="Ex : La déforestation au Bénin" style="max-width: 300px;">
    </div>
    <!-- NOUVEAU : Champ Classe -->
    <div>
        <label for="studentClass">Classe :</label>
        <input type="text" id="studentClass" placeholder="Ex : 3ème A" style="max-width: 150px;">
    </div>
</section>

<main class="container">
    <section class="work-area">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 id="step-title" style="margin: 0;">Édition du Plan</h2>
            <!-- NOUVEAU : Case à cocher Mise en forme automatique -->
            <label for="autoFormatCheckbox" style="font-size: 0.9em; display: flex; align-items: center; gap: 5px;">
                <input type="checkbox" id="autoFormatCheckbox" checked> Mise en forme auto
            </label>
        </div>
        
        <button type="button" id="generateBtn" class="primary-btn">Générer un modèle</button>
        
        <!-- Éditeur classique -->
        <textarea id="editor" class="editor" placeholder="Commencez à rédiger..."></textarea>
        
        <!-- Zone Développement par blocs -->
        <div id="dev-blocks-container" style="display: none;"></div>
        
        <div class="actions-bar">
            <button type="button" id="validateBtn" class="validate-btn">Valider cette étape</button>
            <button type="button" id="nextStepBtn" class="next-btn" style="display: none;">Passer à l'étape suivante</button>
            <button type="button" id="downloadPdf" class="pdf-btn">Télécharger le PDF complet</button>
        </div>
    </section>

    <section class="preview-area">
        <div class="preview-header"><h2>Aperçu A4</h2></div>
        <div class="preview-scroll" id="preview-pages"></div>
    </section>
</main>

<!-- Bibliothèque PDF -->
<script src="https://cdnjs.cloudflare.com"></script>

<!-- NOUVEAU : Bibliothèque Word -->
<script src="https://cdn.jsdelivr.net"></script>

<!-- Votre script personnel doit TOUJOURS être après les bibliothèques -->
<script src="script.js"></script>

</body>
</html>

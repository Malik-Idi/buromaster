<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BuroMaster – Faire mon exposé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>BuroMaster – Faire mon exposé</h1>
    <nav class="steps">
        <span class="active">Plan</span>
        <span>Introduction</span>
        <span>Développement</span>
        <span>Conclusion</span>
    </nav>
</header>

<section class="theme">
    <label>Thème de l’exposé :</label>
    <input type="text" id="theme" placeholder="Ex : La déforestation">
</section>

<main class="container">

<!-- ================= PLAN ================= -->
<section class="work-area" id="plan-section">
    <h2>Plan de l’exposé</h2>

    <button id="generatePlan" class="primary-btn">
        Générer un plan automatiquement
    </button>

    <textarea id="editorPlan" class="editor"></textarea>

    <button id="validatePlan" class="validate-btn">Valider ce plan</button>
</section>

<!-- ================= INTRODUCTION ================= -->
<section class="work-area" id="intro-section" style="display:none;">
    <h2>Introduction</h2>

    <button id="generateIntro" class="primary-btn">
        Générer automatiquement l’introduction
    </button>

    <textarea id="editorIntro" class="editor"
        placeholder="Rédige ton introduction ici..."></textarea>

    <button id="validateIntro" class="validate-btn">
        Valider l’introduction
    </button>
</section>

<!-- ================= APERÇU ================= -->
<section class="preview-area">

<div class="preview-sheet">

    <!-- PAGE 1 : PLAN -->
    <div class="page">
        <div class="page-header">
            <div class="doc-title">PLAN</div>
        </div>
        <div id="previewPlan"></div>
        <div class="page-footer">Page 1</div>
    </div>

    <!-- PAGE 2 : INTRODUCTION -->
    <div class="page" id="introPage" style="display:none;">
        <div class="page-header">
            <div class="doc-title">INTRODUCTION</div>
        </div>
        <div id="previewIntro"></div>
        <div class="page-footer">Page 2</div>
    </div>

</div>

</section>
</main>

<script src="script.js"></script>
</body>
</html>

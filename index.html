<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster – Faire mon exposé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>BuroMaster – Faire mon exposé</h1>
    <nav class="steps">
        <span class="active">Plan</span>
        <span>Introduction</span>
        <span>Développement</span>
        <span>Conclusion</span>
    </nav>
</header>

<section class="theme">
    <label for="theme">Thème de l’exposé :</label>
    <input type="text" id="theme" placeholder="Ex : La déforestation">
</section>

<main class="container">
    <section class="work-area">
        <h2>Plan de l’exposé</h2>
        <button type="button" id="generatePlan" class="primary-btn">Générer un plan automatiquement</button>
        <textarea id="editor" class="editor">I. Introduction...</textarea>
        
        <div class="actions-bar">
            <button type="button" id="downloadPdf" class="pdf-btn">Télécharger en PDF</button>
        </div>
    </section>

    <section class="preview-area">
        <div class="preview-header">
            <h2>Aperçu final</h2>
            <div class="zoom-controls">
                <button type="button" data-zoom="0.6">60%</button>
                <button type="button" data-zoom="0.8">80%</button>
                <button type="button" data-zoom="1">100%</button>
            </div>
        </div>

        <!-- C'est ce bloc qui sera transformé en PDF -->
        <div class="preview-sheet" id="pdf-content">
            <div class="page-header">
                <div id="doc-title">EXPOSÉ</div>
            </div>
            <div id="preview-content">
                <!-- Le JS écrira ici -->
            </div>
            <div class="page-footer">Page 1</div>
        </div>
    </section>
</main>
    
<!-- ON PLACE LES SCRIPTS ICI (À la fin du body) -->
<script src="cdnjs.cloudflare.com"></script>
<script src="script.js"></script>

</body>
</html>

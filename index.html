<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster – Faire mon exposé</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>BuroMaster</h1>
    <nav class="steps">
        <span class="active">Plan</span>
        <span>Intro</span>
        <span>Développement</span>
        <span>Conclusion</span>
    </nav>
</header>

<section class="theme">
    <label for="theme">Thème :</label>
    <input type="text" id="theme" placeholder="Ex : La déforestation au Bénin">
</section>

<main class="container">
    <!-- ZONE ÉDITION -->
    <section class="work-area">
        <h2>Édition du Plan</h2>
        <button type="button" id="generatePlan" class="primary-btn">Générer un modèle</button>
        
        <textarea id="editor" class="editor" placeholder="Tapez votre plan ici..."></textarea>
        
        <div class="actions-bar">
            <button type="button" id="validatePlan" class="validate-btn">Valider ce plan</button>
            <button type="button" id="nextStep" class="next-btn">Passer à l’introduction</button>
            <button type="button" id="downloadPdf" class="pdf-btn">Télécharger en PDF</button>
        </div>
    </section>

    <!-- ZONE APERÇU (S'adapte sur Mobile) -->
    <section class="preview-area">
        <div class="preview-header">
            <h2>Aperçu A4</h2>
            <div class="zoom-controls">
                <button type="button" data-zoom="0.5">50%</button>
                <button type="button" data-zoom="0.8">80%</button>
                <button type="button" data-zoom="1">100%</button>
            </div>
        </div>

        <div class="preview-scroll">
            <div class="preview-sheet" id="pdf-content">
                <div class="page-header">
                    <div id="doc-title">EXPOSÉ</div>
                </div>
                <div id="preview-content">
                    <!-- Le plan s'affiche ici -->
                </div>
                <div class="page-footer">Page 1</div>
            </div>
        </div>
    </section>
</main>
    
<script src="cdnjs.cloudflare.com"></script>
<script src="script.js"></script>

</body>
</html>

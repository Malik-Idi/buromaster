<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Faire Mon Exposé - Plan</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <header class="header">
        <h1>Faire Mon Exposé</h1>
        <nav class="menu">
            <button class="tab active">Plan</button>
            <button class="tab" disabled>Introduction</button>
            <button class="tab" disabled>Développement</button>
            <button class="tab" disabled>Conclusion</button>
        </nav>
    </header>

    <main class="container">
        <section class="left">

            <div class="theme-section">
                <label for="theme">Saisissez votre thème</label>
                <input type="text" id="theme" placeholder="Ex: La déforestation et ses conséquences">
            </div>

            <div class="buttons-row">
                <button id="btn-has-plan">J'ai un plan</button>
                <button id="btn-generate">Générer un plan</button>
            </div>

            <h3>Plan (Brouillon)</h3>
            <textarea id="plan-text" placeholder="Votre plan ici..."></textarea>

            <div class="buttons-col">
                <button id="import-plan">Importer mon plan</button>
                <button id="go-intro">Passer à l'introduction</button>
                <button id="download-plan">Télécharger Plan PDF</button>
            </div>
        </section>

        <section class="right">
            <h2>Aperçu</h2>
            <div id="preview" class="preview-box">Plan</div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>

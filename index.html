<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BuroMaster 2026 – Assistant d'Exposé</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome pour les icônes -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<header>
    <h1><i class="fas fa-graduation-cap"></i> BuroMaster</h1>
    <nav class="steps">
        <!-- Classes harmonisées avec le CSS : step-link et active/unlocked -->
        <span class="step-link active" id="link-plan">Plan</span>
        <span class="step-link" id="link-intro">Intro</span>
        <span class="step-link" id="link-dev">Développement</span>
        <span class="step-link" id="link-conclu">Conclusion</span>
    </nav>
</header>

<!-- Barre de configuration principale -->
<section class="config-bar">
    <div class="config-group">
        <label for="studentClass">Classe :</label>
        <input type="text" id="studentClass" placeholder="Ex: 3ème A">
    </div>
    
    <div class="config-group main-theme">
        <label for="theme">Thème :</label>
        <input type="text" id="themeInput" placeholder="Ex: La déforestation au Bénin">
    </div>

    <div class="config-group">
        <!-- Utilisation de la classe primary-btn ou secondary-btn du CSS -->
        <button id="advancedOptionsBtn" class="validate-btn" style="background: var(--dark-gray);">
            <i class="fas fa-cog"></i> Options
        </button>
        <button id="resetAllBtn" class="reset-btn" style="background: #ff4444; color: white; border: none; padding: 10px; border-radius: 6px; cursor: pointer;">
            <i class="fas fa-trash"></i>
        </button>
    </div>
</section>

<!-- Panneau des options avancées -->
<div id="advancedPanel" class="advanced-panel" style="display: none;">
    <div class="config-group">
        <label>Police :</label>
        <select id="fontSelect">
            <option value="'Segoe UI', sans-serif">Défaut</option>
            <option value="'Times New Roman', serif">Times New Roman</option>
            <option value="'Arial', sans-serif">Arial</option>
        </select>
    </div>
    <div class="config-group">
        <label>Taille :</label>
        <input type="number" id="fontSizeInput" value="12" min="10" max="18" style="width: 60px;"> px
    </div>
    <div class="config-group">
        <label>IA :</label>
        <select id="aiDetailLevel">
            <option value="concis">Concis</option>
            <option value="standard" selected>Standard</option>
            <option value="detaille">Détaillé</option>
        </select>
    </div>
</div>

<main class="container">
    <!-- Zone de travail (Gauche) -->
    <section class="work-area">
        <div class="block-header">
            <h2 id="step-title">Édition du Plan</h2>
            <label style="font-size: 0.8em; cursor: pointer;">
                <input type="checkbox" id="autoFormatCheckbox" checked> Mise en forme auto
            </label>
        </div>
        
        <div class="history-controls">
            <button id="undoBtn" title="Annuler"><i class="fas fa-undo"></i></button>
            <button id="redoBtn" title="Rétablir"><i class="fas fa-redo"></i></button>
        </div>

        <button type="button" id="generateBtn" class="primary-btn">
            <i class="fas fa-magic"></i> Générer avec l'IA
        </button>
        
        <!-- Conteneur pour l'éditeur principal ou les blocs IA -->
        <div id="editor-container">
            <textarea id="editor" class="editor" placeholder="Commencez à rédiger..."></textarea>
            <div id="dev-blocks-container" style="display: none;"></div>
        </div>
        
        <div class="actions-bar" style="margin-top: 20px;">
            <button type="button" id="validateBtn" class="validate-btn">Valider cette étape</button>
            <button type="button" id="nextStepBtn" class="next-btn" style="display: none;">Étape suivante</button>
            <button type="button" id="downloadPdf" class="pdf-btn">
                <i class="fas fa-file-pdf"></i> Télécharger le PDF
            </button>
        </div>
    </section>

    <!-- Zone Aperçu (Droite) -->
    <section class="preview-area">
        <div class="preview-header">
            <h3>Aperçu A4</h3>
            <div class="history-controls" style="background: none;">
                <button id="zoomOutBtn"><i class="fas fa-minus"></i></button>
                <span id="zoomLevel" style="min-width: 40px; text-align: center;">60%</span>
                <button id="zoomInBtn"><i class="fas fa-plus"></i></button>
            </div>
        </div>
        
        <!-- Conteneur de défilement pour les pages A4 -->
        <div class="preview-scroll" id="preview-pages">
            <!-- Injecté par JS : .page-wrapper > .preview-sheet > .page-content -->
        </div>
    </section>
</main>

<!-- SCRIPTS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="script.js"></script>

</body>
</html>

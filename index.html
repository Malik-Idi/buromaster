<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>BuroMaster – Faire mon exposé (Plan)</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <h1>BuroMaster – Faire mon exposé</h1>
    <nav class="steps">
        <span class="active">Plan</span>
        <span>Introduction</span>
        <span>Développement</span>
        <span>Conclusion</span>
    </nav>
</header>

<section class="theme">
    <label>Thème de l’exposé :</label>
    <input type="text" id="theme" placeholder="Ex : La déforestation">
</section>

<main class="container">

<!-- ================= PLAN ================= -->
<section class="work-area" id="plan-section">
    <h2>Plan de l’exposé</h2>

    <button id="generatePlan" class="primary-btn">
        Générer un plan automatiquement
    </button>

    <textarea id="editorPlan" class="editor"
        placeholder="Écris ton plan ici..."></textarea>

    <button id="validatePlan" class="validate-btn">
        Valider ce plan
    </button>
</section>

    <button id="goIntro" class="next-btn">
    Passer à l’introduction
</button>

<button class="pdf-btn">
    Télécharger cette page en PDF
</button>
    
<!-- ================= APERÇU ================= -->
<section class="preview-area">
    <section class="preview-area">

    <!-- EN-TÊTE DE L’APERÇU -->
    <div class="preview-header">
        <!-- ICI LE ZOOM -->
    </div>

    <!-- FEUILLE WORD -->
    <div class="preview-sheet">
        <div id="preview-content"></div>
    </div>

</section>

<div class="preview-sheet">

    <!-- PAGE 1 : Plan Word -->
    <div class="page">
        <div class="page-header">
            <div class="doc-title">PLAN</div>
        </div>
        <div id="previewPlan"></div>
        <div class="page-footer">Page 1</div>
    </div>

</div>
</section>

</main>

<script src="script.js"></script>
</body>
</html>
